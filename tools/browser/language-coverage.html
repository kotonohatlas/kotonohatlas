      try { requested = uiLanguageFor(new URLSearchParams(window.location.search).get("lang") || ""); }
      catch (e) {}
      if (requested && supported.has(requested)) return requested;
      var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      for (var index = 0; index < languages.length; index += 1) {
        var candidate = uiLanguageFor(languages[index]);
        if (candidate && supported.has(candidate)) return candidate;
      }
      return supported.has("en") ? "en" : (data.ui_locales[0] || {}).id || "en";
    }
    function updateUiLanguageUrl(code) {
      if (!window.history || typeof history.replaceState !== "function") return;
      try {
        var url = new URL(window.location.href);
        url.searchParams.set("lang", code);
        replaceUrl(url);
      } catch (e) {}
    }
    function setUiLanguage(code) {
      var supported = new Set((data.ui_locales || []).map(function (item) { return item.id; }));
      var nextLanguage = supported.has(code) ? code : (supported.has("en") ? "en" : lang);
      var changeSerial = ++uiLanguageChangeSerial;
      uiLocaleContext = uiLocaleContextFor(nextLanguage);
      lang = uiLocaleContext.requested;
      updateUiLanguageUrl(lang);
      renderAtlasCopyImmediately();
      if (languageMapController && typeof languageMapController.prefetchPlaces === "function") {
        languageMapController.prefetchPlaces(lang);
      }
      if (languageToggle) languageToggle.setAttribute("aria-busy", "true");
      return loadUiLanguage(nextLanguage, uiLocaleContext).then(function () {
        if (changeSerial !== uiLanguageChangeSerial) return false;
        updateStaticText();
        syncLanguagePicker();
        renderSelectedLanguageDetail();
        window.dispatchEvent(new CustomEvent("atlas:ui-language-change", {detail:{language:lang}}));
        scheduleUiLanguageRemainder(changeSerial);
        return true;
      }).finally(function () {
        if (changeSerial === uiLanguageChangeSerial && languageToggle) {
          languageToggle.removeAttribute("aria-busy");
        }
      });
    }
    function scheduleUiLanguageRemainder(changeSerial) {
      var tasks = [
        renderLanguageMap,
        renderCountrySelect,
        function () { renderCatalog(true); },
        renderFooter
      ];
      function runNext() {
        if (changeSerial !== uiLanguageChangeSerial || !tasks.length) return;
        tasks.shift()();
        if (tasks.length) window.requestAnimationFrame(function () { window.setTimeout(runNext, 0); });
      }
      // Let the browser paint the new UI-language identity before any map or
      // catalog work.  A cached localization must not collapse both phases
      // back into one long task.
      window.requestAnimationFrame(function () { window.setTimeout(runNext, 0); });
    }
    function preferredUiLanguages() {
      var supported = new Set((data.ui_locales || []).map(function (item) { return item.id; }));
      var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      var result = [];
      languages.forEach(function (tag) {
        var candidate = uiLanguageFor(tag);
        if (candidate && supported.has(candidate) && result.indexOf(candidate) === -1) result.push(candidate);
      });
      return result;
    }
    function updateDisplayLanguageWide(items, edge) {
      Array.prototype.forEach.call(items || [], function (item) {
        item.classList.remove("atlas-language-wide");
      });
      if (!items || items.length % 2 === 0) return;
      var index = edge === "first" ? 0 : items.length - 1;
      if (items[index]) items[index].classList.add("atlas-language-wide");
    }
    function displayLanguageItem(item, group) {
      return '<li class="md-select__item atlas-language-' + group + '" data-display-language-item="' + esc(item.id) + '">' +
        '<button type="button" class="md-select__link" data-display-language="' + esc(item.id) + '" lang="' + esc(item.id) + '" role="option">' + esc(item.label) + '</button></li>';
    }
    function populateLanguageSelector() {
      var list = document.getElementById("display-language-menu");
      var panel = list.parentNode;
      panel.querySelectorAll("[data-atlas-display-language-preferred-list], [data-atlas-display-language-location-list]").forEach(function (node) { node.remove(); });
      var preferred = preferredUiLanguages();
      var preferredSet = new Set(preferred);
      var byId = new Map((data.ui_locales || []).map(function (item) { return [item.id, item]; }));
      list.innerHTML = (data.ui_locales || []).filter(function (item) {
        return !preferredSet.has(item.id);
      }).map(function (item) { return displayLanguageItem(item, "other"); }).join("");
      if (preferred.length) {
        var preferredList = document.createElement("ul");
        preferredList.className = "atlas-language-preferred-list";
        preferredList.setAttribute("data-atlas-language-preferred-list", "");
        preferredList.setAttribute("data-atlas-display-language-preferred-list", "");
        preferredList.innerHTML = preferred.map(function (id) {
          return displayLanguageItem(byId.get(id), "preferred");
        }).join("");
        panel.insertBefore(preferredList, list);
        updateDisplayLanguageWide(preferredList.children, "first");
      }
      updateDisplayLanguageWide(list.children, "last");
      document.getElementById("display-language-count").textContent = String((data.ui_locales || []).length);
      updateLanguageMenuState();
    }
    function loadDisplayLocationLanguages() {
      var list = document.getElementById("display-language-menu");
      if (list.dataset.atlasLocationReady) return;
      if (!localeAccess || typeof localeAccess.getAccessLanguageSuggestions !== "function") {
        list.dataset.atlasLocationReady = "1";
        return;
      }
      list.dataset.atlasLocationReady = "loading";
      var preferredSet = new Set(preferredUiLanguages());
      localeAccess.getAccessLanguageSuggestions().then(function (languages) {
        var location = [];
        (languages || []).forEach(function (tag) {
          var candidate = uiLanguageFor(tag);
          if (candidate && !preferredSet.has(candidate) && location.indexOf(candidate) === -1) location.push(candidate);
        });
        if (!location.length || !list.parentNode) return;
        var locationList = document.createElement("ul");
        locationList.className = "atlas-language-location-list";
        locationList.setAttribute("data-atlas-language-location-list", "");
        locationList.setAttribute("data-atlas-display-language-location-list", "");
        location.forEach(function (id) {
          var item = list.querySelector('[data-display-language-item="' + id + '"]');
          if (!item) return;
          item.classList.remove("atlas-language-other", "atlas-language-wide");
          item.classList.add("atlas-language-location");
          locationList.appendChild(item);
        });
        if (!locationList.children.length) return;
        list.parentNode.insertBefore(locationList, list);
        updateDisplayLanguageWide(locationList.children, "last");
        updateDisplayLanguageWide(list.children, "last");
      }).catch(function () {}).finally(function () {
        list.dataset.atlasLocationReady = "1";
      });
    }
    function updateLanguageMenuState() {
      document.querySelectorAll("[data-display-language-item]").forEach(function (item) {
        var current = item.dataset.displayLanguageItem === lang;
        item.classList.toggle("atlas-language-current", current);
        var button = item.querySelector("[data-display-language]");
        if (button) {
          button.setAttribute("aria-selected", current ? "true" : "false");
          if (current) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        }
      });
    }
    lang = preferredUiLanguage();
    uiLocaleContext = uiLocaleContextFor(lang);
    lang = uiLocaleContext.requested;
    updateUiLanguageUrl(lang);
    initialMapViewState = mapViewStateFromUrl();
    initialMapViewRestorePending = Boolean(initialMapViewState);
    renderAtlasCopyImmediately();
    var languageSwitcher = document.querySelector(".language-toggle");
    var languageToggle = document.getElementById("display-language-toggle");
    document.querySelector(".language-toggle .atlas-language-switcher__panel").addEventListener("click", function (event) {
      var button = event.target.closest("[data-display-language]");
      if (!button) return;
      setUiLanguage(button.dataset.displayLanguage);
      languageSwitcher.open = false;
      languageToggle.setAttribute("aria-expanded", "false");
      languageToggle.focus();
    });
    languageSwitcher.addEventListener("toggle", function () {
      languageToggle.setAttribute("aria-expanded", languageSwitcher.open ? "true" : "false");
      if (languageSwitcher.open) loadDisplayLocationLanguages();
    });
    document.addEventListener("click", function (event) {
      if (languageSwitcher.open && !languageSwitcher.contains(event.target)) languageSwitcher.open = false;
    });
    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape" || !languageSwitcher.open) return;
      languageSwitcher.open = false;
      languageToggle.focus();
    });
    document.getElementById("country-search").addEventListener("focus", function (event) {
      event.target.select();
      syncFamilyPicker();
      syncScriptPicker();
      hideLanguageOptions();
      renderCountryOptions("");
    });
    document.getElementById("country-search").addEventListener("click", function (event) {
      if (document.getElementById("country-options").hidden) {
        event.target.select();
        hideLanguageOptions();
        renderCountryOptions("");
      }
    });
    document.getElementById("country-search").addEventListener("input", function (event) { renderCountryOptions(event.target.value); });
    document.getElementById("country-search").addEventListener("compositionstart", function () { countryComposing = true; });
    document.getElementById("country-search").addEventListener("compositionend", function (event) {
      countryComposing = false;
      renderCountryOptions(event.currentTarget.value);
    });
    document.getElementById("country-search").addEventListener("keydown", function (event) {
      if (event.isComposing || countryComposing || event.keyCode === 229) return;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (document.getElementById("country-options").hidden) renderCountryOptions(event.currentTarget.value);
        setActiveCountryOption(activeCountryIndex + (event.key === "ArrowDown" ? 1 : -1));
      } else if (event.key === "Enter" && activeCountryIndex >= 0) {
        event.preventDefault();
        chooseCountry(countryMatches[activeCountryIndex], true);
      } else if (event.key === "Escape") {
        chooseCountries(selectedCountryCodes.length ? selectedCountryCodes : [selectedCountry], selectedCountryLabel, false, selectedCountryFeatureId, true);
      }
    });
    document.getElementById("language-search").addEventListener("focus", function (event) {
      syncFamilyPicker();
      syncScriptPicker();
      hideCountryOptions();
      scheduleLanguageOptionsRender("");
    });
    document.getElementById("language-search").addEventListener("click", function (event) {
      if (document.getElementById("language-options").hidden) {
        event.target.select();
        hideCountryOptions();
        scheduleLanguageOptionsRender("");
      }
    });
    document.getElementById("language-search").addEventListener("input", function (event) {
      cancelAdmin1CandidatePrefetch();
      if (!languageComposing) scheduleLanguageOptionsRender(event.target.value);
    });
    document.getElementById("language-search").addEventListener("compositionstart", function () {
      languageComposing = true;
      cancelAdmin1CandidatePrefetch();
    });
    document.getElementById("language-search").addEventListener("compositionend", function (event) {
      languageComposing = false;
      scheduleLanguageOptionsRender(event.currentTarget.value);
    });
    document.getElementById("language-search").addEventListener("keydown", function (event) {
      if (event.isComposing || languageComposing || event.keyCode === 229) return;
      if (languageSearchRenderFrame && (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter")) {
        flushLanguageOptionsRender(event.currentTarget.value);
      }
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (document.getElementById("language-options").hidden) flushLanguageOptionsRender(event.currentTarget.value);
        setActiveLanguageOption(activeLanguageIndex + (event.key === "ArrowDown" ? 1 : -1));
      } else if (event.key === "Enter" && activeLanguageIndex >= 0) {
        event.preventDefault();
        selectLanguageMatch(languageMatches[activeLanguageIndex], "language-picker");
      } else if (event.key === "Escape") {
        syncLanguagePicker();
      }
    });
    document.getElementById("language-options").addEventListener("mousedown", function (event) {
      if (event.target.closest(".language-option")) event.preventDefault();
    });
    document.getElementById("language-options").addEventListener("click", function (event) {
      if (event.target.closest("[data-language-more]")) {
        loadMoreLanguageOptions();
        return;
      }
      var button = event.target.closest(".language-option");
      if (!button) return;
      selectLanguageMatch(languageMatches[Number(button.dataset.languageIndex)], "language-picker");
    });
    document.getElementById("language-options").addEventListener("pointerover", function (event) {
      var button = event.target.closest(".language-option");
      if (!button || (event.relatedTarget && button.contains(event.relatedTarget))) return;
      setActiveLanguageOption(Number(button.dataset.languageIndex));
    });
    document.getElementById("language-options").addEventListener("focusin", function (event) {
      var button = event.target.closest(".language-option");
      if (button) setActiveLanguageOption(Number(button.dataset.languageIndex));
    });
    document.getElementById("language-options").addEventListener("scroll", function (event) {
      var options = event.currentTarget;
      if (!options.querySelector("[data-language-more]") || options.scrollTop + options.clientHeight < options.scrollHeight - 48) return;
      if (languageOptionsLoadFrame) return;
      languageOptionsLoadFrame = window.requestAnimationFrame(function () {
        languageOptionsLoadFrame = 0;
        loadMoreLanguageOptions();
      });
    });
    document.getElementById("country-context-clear").addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      clearCountryContext();
    });
    document.getElementById("language-context-clear").addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      clearLanguageContext();
    });
    document.getElementById("family-context-clear").addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      clearLanguageContext();
    });
    document.getElementById("script-context-clear").addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      clearLanguageContext();
    });
    document.getElementById("family-search").addEventListener("focus", function () {
      hideCountryOptions();
      syncLanguagePicker();
      hideScriptOptions();
      renderFamilyOptions("");
    });
    document.getElementById("family-search").addEventListener("click", function () {
      if (document.getElementById("family-options").hidden) {
        hideScriptOptions();
        renderFamilyOptions("");
      }
    });
    document.getElementById("family-search").addEventListener("input", function (event) { renderFamilyOptions(event.target.value); });
    document.getElementById("family-search").addEventListener("compositionstart", function () { familyComposing = true; });
    document.getElementById("family-search").addEventListener("compositionend", function (event) {
      familyComposing = false;
      renderFamilyOptions(event.currentTarget.value);
    });
    document.getElementById("family-search").addEventListener("keydown", function (event) {
      if (event.isComposing || familyComposing || event.keyCode === 229) return;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (document.getElementById("family-options").hidden) renderFamilyOptions(event.currentTarget.value);
        setActiveFamilyOption(activeFamilyIndex + (event.key === "ArrowDown" ? 1 : -1));
      } else if (event.key === "Enter" && activeFamilyIndex >= 0) {
        event.preventDefault();
        var row = familyMatches[activeFamilyIndex];
        syncFamilyPicker();
        showFamilyOnMap(row.family_group, row.family_label);
      } else if (event.key === "Escape") {
        syncFamilyPicker();
      }
    });
    document.getElementById("script-search").addEventListener("focus", function () {
      hideCountryOptions();
      syncLanguagePicker();
      syncFamilyPicker();
      renderScriptOptions("");
    });
    document.getElementById("script-search").addEventListener("click", function () {
      if (document.getElementById("script-options").hidden) {
        syncFamilyPicker();
        renderScriptOptions("");
      }
    });
    document.getElementById("script-search").addEventListener("input", function (event) { renderScriptOptions(event.target.value); });
    document.getElementById("script-search").addEventListener("compositionstart", function () { scriptComposing = true; });
    document.getElementById("script-search").addEventListener("compositionend", function (event) {
      scriptComposing = false;
      renderScriptOptions(event.currentTarget.value);
    });
    document.getElementById("script-search").addEventListener("keydown", function (event) {
      if (event.isComposing || scriptComposing || event.keyCode === 229) return;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (document.getElementById("script-options").hidden) renderScriptOptions(event.currentTarget.value);
        setActiveScriptOption(activeScriptIndex + (event.key === "ArrowDown" ? 1 : -1));
      } else if (event.key === "Enter" && activeScriptIndex >= 0) {
        event.preventDefault();
        var row = scriptMatches[activeScriptIndex];
        syncScriptPicker();
        showScriptOnMap(row.script, row.script_label);
      } else if (event.key === "Escape") {
        syncScriptPicker();
      }
    });
    document.addEventListener("mousedown", function (event) {
      var options = document.getElementById("country-options");
      if (!options.hidden && !document.getElementById("country-combobox").contains(event.target)) {
        chooseCountries(selectedCountryCodes.length ? selectedCountryCodes : [selectedCountry], selectedCountryLabel, false, selectedCountryFeatureId, true);
      }
      var languageOptions = document.getElementById("language-options");
      if (!languageOptions.hidden && !document.getElementById("language-combobox").contains(event.target)) {
        syncLanguagePicker();
      }
      var familyOptions = document.getElementById("family-options");
      if (!familyOptions.hidden && !document.getElementById("family-combobox").contains(event.target)) {
        syncFamilyPicker();
      }
      var scriptOptions = document.getElementById("script-options");
      if (!scriptOptions.hidden && !document.getElementById("script-combobox").contains(event.target)) {
        syncScriptPicker();
      }
    });
    document.getElementById("search").addEventListener("input", function () {
      selectionState = {mode:"none", source:"none", label:"", parentCode:"", languages:new Set(), countries:new Set()};
      languageCountryContextActive = false;
      syncLanguagePicker();
      renderCatalog();
      updateSelectorUrl();
    });
    document.getElementById("country-detail").addEventListener("click", function (event) {
      if (event.target.closest("[data-clear-country]")) {
        clearCountryContext();
        return;
      }
      var target = event.target.closest("[data-map-language]");
      if (target) showLanguageOnMap(target.getAttribute("data-map-language"));
    });
    document.getElementById("selected-language-summary").addEventListener("click", function (event) {
      if (event.target.closest("[data-clear-language]")) clearLanguageContext();
    });
    document.getElementById("sort-order").addEventListener("change", renderCatalog);
    document.getElementById("family-map-back").addEventListener("click", function () {
      if (familySelectionContext) showFamilyOnMap(familySelectionContext.family, familySelectionContext.label);
      else if (scriptSelectionContext) showScriptOnMap(scriptSelectionContext.script, scriptSelectionContext.label);
    });
    Promise.all([loadLinguisticCore(), loadUiLanguage(lang, uiLocaleContext)]).then(function () {
      hydrateAccessOnlyLocales();
      warmLanguageSearchIndex(false);
      populateLanguageSelector();
      explicitWorldSelection = explicitWorldFromUrl();
      initialMapFocus = mapFocusFromUrl();
      if (initialMapFocus) {
        countrySelectionChanged = true;
        if (explicitWorldSelection) countryDetailActive = false;
        if (initialMapFocus.countries && initialMapFocus.countries.length) {
          selectedCountry = initialMapFocus.countries[0];
          countryPrefetchEnabled = true;
        }
      }
      renderAll();
      if (initialMapFocus && initialMapFocus.countries && initialMapFocus.countries.length) {
        chooseCountries(
          initialMapFocus.countries,
          initialMapFocus.countries.map(countryName).join(" + "),
          true,
          initialMapFocus.featureId || ""
        );
      }
      if (initialMapFocus && initialMapFocus.mode === "language") {
        selectLanguages([initialMapFocus.row], languageName(initialMapFocus.row), "url");
      } else if (initialMapFocus && initialMapFocus.mode === "language-group") {
        selectLanguages(initialMapFocus.rows, resolvedLanguageName(initialMapFocus.code, lang), "url", initialMapFocus.code);
      } else if (initialMapFocus && initialMapFocus.mode === "languages") {
        selectLanguages(initialMapFocus.rows, tf("languageCount", {count:initialMapFocus.rows.length}), "url");
      } else if (initialMapFocus && initialMapFocus.mode === "family") {
        showFamilyOnMap(initialMapFocus.family, taxonomyFamilyLabel(initialMapFocus.family));
      } else if (initialMapFocus && initialMapFocus.mode === "script") {
        showScriptOnMap(initialMapFocus.script, scriptLabel(initialMapFocus.script));
      }
      initializingCoverage = false;
      updateSelectorUrl();
      window.setTimeout(scheduleDeferredPageRender, 8000);
    });
    if (localeAccess && typeof localeAccess.getCountryCode === "function") {
      localeAccess.getCountryCode().then(function (country) {
        if (!/^[A-Z]{2}$/.test(country || "")) return;
        accessCountry = country;
        if (languageMapController) {
          languageMapOptionsDirty = true;
          scheduleLanguageMapUpdate();
        }
        if (initialMapFocus) return;
        if (!countrySelectionChanged && allCountries().indexOf(country) !== -1) {
          if (country !== selectedCountry) chooseCountry(country, false);
          else if (languageMapController && selectionState.mode !== "language") {
            pendingMapCountries = {
              codes:[country],
              label:countryName(country),
              featureId:"",
              options:{preserveCamera:false, prefetch:false}
            };
            scheduleLanguageMapUpdate();
          }
        }
      });
    }
    }
    fetch("./coverage.json?v=__COVERAGE_VERSION__", {credentials:"same-origin"}).then(function (response) {
      if (!response.ok) throw new Error("language coverage unavailable: " + response.status);
      return response.json();
    }).then(initCoverage).catch(function (error) {
      try { console.error("Kotonohatlas language coverage failed", error); } catch (e) {}
      var catalog = document.getElementById("catalog");
      if (catalog) catalog.innerHTML = '<div class="empty">Language coverage data could not be loaded.</div>';
    });
  }());
  </script>
